name: Reviewed Pages artifact deployment

# Manual candidate only. Switch Pages from branch publishing to Actions before
# adopting this workflow; never run both publication mechanisms concurrently.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reviewed-pages-deployment
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/ci.yml
    with:
      stage-pages: true
  deploy:
    timeout-minutes: 60
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
