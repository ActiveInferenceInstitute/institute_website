name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      stage-pages:
        description: Stage the checked source for the separate reviewed deployment
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    timeout-minutes: 120
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # package-lock.json has no dependencies. Do not repeat no-op installs.
      - name: Build static site
        run: ./run.sh build
      - name: Run full offline gate (includes lint and docs)
        run: ./run.sh full
      - name: Run browser regressions once
        run: CHROME_BIN="$(command -v google-chrome)" WEBSITE_AUDIT_OUTPUT="$RUNNER_TEMP/website-browser" ./run.sh browser
      - name: Verify committed output is up to date
        run: git diff --exit-code
      - name: Stage public output and bind deployment identity
        if: inputs.stage-pages
        env:
          SITE_ARTIFACT: ${{ runner.temp }}/reviewed-site
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_RUN: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/stage_public_assets.py --output "$SITE_ARTIFACT" --commit "$RELEASE_SHA" --run-url "$RELEASE_RUN"
      - name: Upload reviewed Pages artifact
        if: inputs.stage-pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/reviewed-site

  compatibility:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - node: "24"
            python: "3.12"
          - node: "22"
            python: "3.15"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # Compatibility smoke only; full generated-site/browser work is above.
      - run: ./run.sh lint
      - run: ./run.sh fast

  gnn-conformance:
    name: gnn conformance (pinned)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Set up Node.js for the shared entry point
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install pinned GNN parser
        run: python3 scripts/check_gnn_conformance.py --install
      - name: Verify pinned parser and repository sketches
        run: ./run.sh gnn
